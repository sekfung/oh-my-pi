name: Desktop

on:
   push:
      branches: [main]
      paths:
         - "packages/desktop/**"
         - "packages/coding-agent/**"
         - "bun.lock"
         - "bunfig.toml"
         - "package.json"
         - "rust-toolchain.toml"
         - ".github/workflows/desktop.yml"
   pull_request:
      branches: [main]
      paths:
         - "packages/desktop/**"
         - "packages/coding-agent/**"
         - "bun.lock"
         - "bunfig.toml"
         - "package.json"
         - "rust-toolchain.toml"
         - ".github/workflows/desktop.yml"
   workflow_dispatch:

concurrency:
   group: "${{ github.workflow }}-${{ github.ref }}"
   cancel-in-progress: true

permissions:
   contents: read

jobs:
   # Linux is validated first per docs/desktop-design.md — macOS and Windows
   # installers follow once the Linux path is exercised in CI. deb and rpm
   # build through tauri-cli's own bundlers and must succeed. AppImage is
   # best-effort: linuxdeploy (its bundler) is itself a FUSE-mounted AppImage
   # (needs libfuse2, absent by default on Ubuntu 24.04+ runners, plus
   # APPIMAGE_EXTRACT_AND_RUN as a fallback) and is a known-fragile prebuilt
   # binary upstream — a crash there shouldn't fail deb/rpm delivery.
   linux:
      name: Linux bundles (deb, rpm, AppImage)
      runs-on: ubuntu-latest
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

         - name: Install system dependencies
           run: |
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends \
                libwebkit2gtk-4.1-dev \
                libgtk-3-dev \
                libayatana-appindicator3-dev \
                librsvg2-dev \
                libfuse2t64 \
                file \
                rpm

         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
           with:
              bun-version: "1.3"

         - name: Cache bun dependencies
           uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
           with:
              path: ~/.bun/install/cache
              key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}

         - name: Cache cargo registry and target
           uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
           with:
              path: |
                 ~/.cargo/registry
                 ~/.cargo/git
                 target
              key: cargo-desktop-${{ runner.os }}-${{ hashFiles('packages/desktop/src-tauri/Cargo.lock') }}
              restore-keys: |
                 cargo-desktop-${{ runner.os }}-

         - run: bun install --frozen-lockfile

         - name: Build the desktop sidecar
           run: bun run --cwd packages/desktop sidecar

         - name: Build deb and rpm bundles
           run: bun run --cwd packages/desktop tauri build --bundles deb,rpm

         - name: Build AppImage bundle (best-effort)
           id: appimage
           continue-on-error: true
           env:
              APPIMAGE_EXTRACT_AND_RUN: "1"
           run: bun run --cwd packages/desktop tauri build --bundles appimage

         - name: Note AppImage bundling failure
           if: steps.appimage.outcome == 'failure'
           run: echo "::warning::AppImage bundling failed (linuxdeploy is a known-fragile upstream binary) — deb/rpm still shipped." >> "$GITHUB_STEP_SUMMARY"

         - name: Smoke-test the produced bundles
           run: bun run packages/desktop/scripts/smoke-test-linux-bundle.ts

         - name: Upload bundles
           uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
           with:
              name: omp-desktop-linux-bundles
              path: |
                 target/release/bundle/deb/*.deb
                 target/release/bundle/rpm/*.rpm
                 target/release/bundle/appimage/*.AppImage
              if-no-files-found: warn
